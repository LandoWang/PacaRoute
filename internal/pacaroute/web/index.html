<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PacaRoute</title><link rel="stylesheet" href="/app.css"></head><body><aside><div class="brand"><img src="/mark.svg" alt="极光羊驼"><div>PacaRoute<small>Agent request gateway</small></div></div><nav id="nav"></nav><div class="foot"><span class="dot"></span><span id="status">连接中</span><button id="logout">退出管理</button></div></aside><main><header><div><p class="eyebrow">YOUR MODELS. YOUR ROUTES.</p><h1 id="title">导览</h1></div><button id="refresh">刷新</button></header><div id="notice" role="status"></div><section id="content"></section></main><dialog id="login"><form id="login-form"><h2>连接 PacaRoute</h2><p>输入服务主机上的管理密钥。CLI 使用 <code>pacaroute ui</code> 查看访问方式。</p><label>管理密钥<input id="admin-key" type="password" required autocomplete="off"></label><button>连接</button><p id="login-error"></p></form></dialog><dialog id="editor"><form id="edit-form"><h2 id="edit-title"></h2><div id="fields"></div><div class="actions"><button type="button" id="cancel">取消</button><button>保存</button></div></form></dialog><script src="/app.js" defer></script></body></html>
